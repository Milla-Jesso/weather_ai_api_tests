name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily health check against the live API, independent of code changes.
    # Runs 06:00 UTC every day, only on the default branch.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - error-handling
          - performance

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        # test_scope only exists on workflow_dispatch; push/PR/schedule runs
        # always get the empty default and fall through to the full suite.
        # Values match the @smoke / @error-handling / @performance tags in
        # test titles (see README "Test tags") — Playwright's --grep
        # matches them as a substring/regex against the full test title.
        run: |
          if [ -n "$TEST_SCOPE" ] && [ "$TEST_SCOPE" != "all" ]; then
            npx playwright test --grep "@$TEST_SCOPE"
          else
            npx playwright test
          fi
        env:
          WEATHER_AI_BASE_URL: https://weather-ai.co
          WEATHER_AI_API_KEY: ${{ secrets.WEATHER_AI_API_KEY }}
          TEST_SCOPE: ${{ inputs.test_scope }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: test-results/results.json
          retention-days: 14

      - name: Upload report for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  # Publishes the HTML report to GitHub Pages so there's a live,
  # shareable link to the latest run's results — not just a CI log.
  # One-time setup: repo Settings > Pages > Source = "GitHub Actions".
  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
